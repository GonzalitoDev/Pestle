name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

# Only the release step needs write access (to publish the APK).
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Backend the app talks to. Set the PESTLE_API_URL repository variable to override.
      VITE_API_BASE: ${{ vars.PESTLE_API_URL || 'https://pestesting.vercel.app' }}
      PESTLE_VERSION_CODE: ${{ github.run_number }}
      PESTLE_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync web app into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pestle.jks"
            echo "path=$RUNNER_TEMP/pestle.jks" >> "$GITHUB_OUTPUT"
            echo "Signing with the release key from repository secrets."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: building a debug-signed APK."
          fi

      - name: Build APK
        working-directory: android
        env:
          PESTLE_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          PESTLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PESTLE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PESTLE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$PESTLE_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../Pestle.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Pestle.apk
          fi
          ls -lh ../Pestle.apk
          sha256sum ../Pestle.apk | tee ../Pestle.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Pestle-${{ env.PESTLE_VERSION_NAME }}
          path: |
            Pestle.apk
            Pestle.apk.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.PESTLE_VERSION_NAME }}
          name: Pestle for Android ${{ env.PESTLE_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            Pestle.apk
            Pestle.apk.sha256
          body: |
            Android app built from ${{ github.sha }} (${{ github.ref_name }}).

            **Install:** download `Pestle.apk` on your phone, open it and allow installing from this source when Android asks.
            SHA-256 checksum: see `Pestle.apk.sha256`.
