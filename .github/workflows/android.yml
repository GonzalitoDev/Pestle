name: Android APK

# Builds the Android app and publishes it as a GitHub Release (Pestle.apk).
#
# Security:
# - Only GitHub's own actions are used, pinned to exact commit SHAs (a moved tag can't inject code).
# - The build job has a read-only token; only the small release job can write, and only releases.
# - Signing secrets (optional) are exposed to the Gradle step only.

# The APK is normally built by Vercel and served from the site (/Pestle.apk); this workflow is
# an optional manual alternative that publishes it as a GitHub Release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Backend the app talks to. Set the PESTLE_API_URL repository variable to override.
      VITE_API_BASE: ${{ vars.PESTLE_API_URL || 'https://pestesting.vercel.app' }}
      PESTLE_VERSION_CODE: ${{ github.run_number }}
      PESTLE_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync web app into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # The Android SDK is preinstalled on GitHub's Ubuntu runners; just add the packages we need.
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PESTLE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PESTLE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PESTLE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with the release key from repository secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pestle.jks"
            PESTLE_KEYSTORE_PATH="$RUNNER_TEMP/pestle.jks" ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../Pestle.apk
            rm -f "$RUNNER_TEMP/pestle.jks"
          else
            echo "No signing secrets: building a debug-signed APK."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Pestle.apk
          fi
          cd ..
          ls -lh Pestle.apk
          sha256sum Pestle.apk | tee Pestle.apk.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Pestle-apk
          path: |
            Pestle.apk
            Pestle.apk.sha256
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Pestle-apk

      # GitHub's own CLI (preinstalled), authenticated with this job's short-lived token.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          gh release create "android-v$VERSION" Pestle.apk Pestle.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Pestle for Android $VERSION" \
            --latest \
            --notes "Android app built from $GITHUB_SHA.

          Install: download Pestle.apk on your phone, open it and allow installing from this source when Android asks.
          Verify: the SHA-256 checksum is in Pestle.apk.sha256."
